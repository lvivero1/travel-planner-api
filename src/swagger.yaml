openapi: 3.0.0
info:
  title: Travel Planner API
  version: "1.0.0"
  description: OpenAPI docs for Travel Planner (Steps 4-10).
servers:
  - url: http://localhost:3000
    description: Local Development server
  - url: https://travel-planner-api-u0r6.onrender.com
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: owner
        email:
          type: string
          example: owner@example.com
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJI...
    Trip:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Summer Trip
        startDate:
          type: string
          format: date-time
          example: "2026-10-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-10-03T00:00:00.000Z"
        userId:
          type: integer
          example: 1
    Destination:
      type: object
      properties:
        id:
          type: integer
          example: 1
        city:
          type: string
          example: Barcelona
        country:
          type: string
          example: Spain
        tripId:
          type: integer
          example: 1
    Activity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Walking Tour
        notes:
          type: string
          example: Meet at 9:00
        destinationId:
          type: integer
          example: 1
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required: [name, email, password]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Conflict - Email already exists
        '400':
          description: Missing required fields (name,email,password)
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    token: eyJhbGciOiJI...
        '400':
          description: Missing required fields (email,password)
        '401':
          description: Unauthorized - Invalid credentials
          '500':
            description: Server error
  /api/trips:
    get:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: List trips for authenticated user
      responses:
        '200':
          description: Trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        "401":
          description: Unauthorized - Missing or invalid token
    post:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Create trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
              required: [title, startDate, endDate]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized - Missing or invalid token
        '400':
          description: Missing required fields (title,startDate,endDate)
  /api/trips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Get trip
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Trip does not exist or does not belong to user
    put:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Update trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                description:
                  type: string
                budget:
                  type: number
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Validation error
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Trip does not exist or does not belong to user
    delete:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Delete trip
      responses:
        '200':
          description: Trip deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Trip deleted
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Trip does not exist or does not belong to user
  /api/destinations:
    get:
      tags: [Destinations]
      security: [{ bearerAuth: [] }]
      summary: List destinations
      responses:
        '200':
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '401':
          description: Unauthorized - Missing or invalid token
    post:
      tags: [Destinations]
      security: [{ bearerAuth: [] }]
      summary: Create destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                country:
                  type: string
                tripId:
                  type: integer
              required: [city, country, tripId]
        '401':
          description: Unauthorized - Missing or invalid token
          '400':
            description: Missing required fields (city,country,tripId) or tripId does not belong to user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
  /api/destinations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Destinations]
      security: [{ bearerAuth: [] }]
      summary: Get destination
      responses:
        '200':
          description: Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Destination does not exist or does not belong to user
    put:
      tags: [Destinations]
      security: [{ bearerAuth: [] }]
      summary: Update destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                country:
                  type: string
                arrivalDate:
                  type: string
                  format: date-time
                departureDate:
                  type: string
                  format: date-time
                notes:
                  type: string
                tripId:
                  type: integer
      responses:
        '200':
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          description: Validation error
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Destination does not exist or does not belong to user
    delete:
      tags: [Destinations]
      security: [{ bearerAuth: [] }]
      summary: Delete destination
      responses:
        '200':
          description: Destination deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Destination deleted
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Destination does not exist or does not belong to user
  /api/activities:
    get:
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      summary: List activities
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        '401':
          description: Unauthorized - Missing or invalid token
    post:
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      summary: Create activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                notes:
                  type: string
                destinationId:
                  type: integer
              required: [name, destinationId]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
  /api/activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      summary: Get activity
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Activity does not exist or does not belong to user
    put:
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      summary: Update activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                activityDate:
                  type: string
                  format: date-time
                cost:
                  type: number
                status:
                  type: string
                destinationId:
                  type: integer
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Validation error
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Activity does not exist or does not belong to user
    delete:
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      summary: Delete activity
      responses:
        '200':
          description: Activity deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Activity deleted
        '401':
          description: Unauthorized - Missing or invalid token
        '404':
          description: Not found - Activity does not exist or does not belong to user
        '401':
          description: Unauthorized - Missing or invalid token
        '400':
          description: Missing required fields (name,destinationId) or destinationId does not belong to